{% extends "html_member/base.html" %}

{% block nav_career_menu %}menu-open{% endblock %}
{% block nav_career_list %}active{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card card-danger card-outline">
        <div class="card-header">
            <h3 class="card-title"><i class="fas fa-trash"></i> Delete Career Post</h3>
        </div>
        <div class="card-body">
            <p>Are you sure you want to delete this post?</p>
            <p><strong>{{ item.title }}</strong></p>
        </div>
        <div class="card-footer text-right">
            <form method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
            </form>
            <a href="{% url 'career:member_career_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
